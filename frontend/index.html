
<!DOCTYPE html>

<html>

<head>

<title>Planner AI</title>

<style>

body {
    font-family: Arial, sans-serif;
    background:#111827;
    color:white;
    text-align:center;
    padding:50px;
}


.container {
    max-width:700px;
    margin:auto;
}


textarea {

width:90%;
height:120px;
padding:15px;
font-size:16px;

}


button {

padding:15px 30px;
margin-top:20px;
font-size:18px;
cursor:pointer;

}


#output {

margin-top:30px;
background:#1f2937;
padding:20px;
border-radius:10px;
text-align:left;

}


</style>

</head>


<body>


<div class="container">


<h1>🧠 Planner AI</h1>

<p>Your Autonomous Planning Assistant</p>


<textarea id="request"
placeholder="Enter your goal...">
</textarea>


<br>


<button onclick="generatePlan()">
Generate Plan
</button>


<div id="output">
Waiting for request...
</div>


</div>



<script>


async function generatePlan(){


let request =
document.getElementById("request").value;


document.getElementById("output").innerHTML =
"🧠 AI Thinking...";


let response =
await fetch(
"http://localhost:8000/plan",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(
{
request:request
}
)

}
);


let data =
await response.json();



document.getElementById("output").innerHTML =
"<pre>"+
JSON.stringify(data,null,2)
+"</pre>";


}


</script>


</body>

</html>
